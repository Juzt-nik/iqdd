server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images can be a few MB; match the backend's own limit.
    client_max_body_size 20M;

    # Reverse-proxy API + health calls to the backend service (Docker
    # Compose service name "backend"), so the browser only ever talks to
    # this single origin — no CORS configuration needed in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: any non-file route resolves to index.html so React
    # Router's client-side routes (e.g. /history/:id) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
